---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="{% if page.layout == 'editorial' %}is-editorial-home{% endif %}">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

    <script>
      window.addEventListener("load", function () {
        if (window.jQuery) window.jQuery("a").off("click.smoothscroll");
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var root = document.documentElement;
        var masthead = document.querySelector(".masthead");
        var themeButton = document.querySelector("[data-theme-toggle]");
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function syncTheme() {
          var isDark = root.getAttribute("data-theme") === "dark";
          if (themeButton) themeButton.setAttribute("aria-label", isDark ? "Switch to light theme" : "Switch to dark theme");
          if (themeMeta) themeMeta.setAttribute("content", "#101d34");
        }

        if (themeButton) {
          themeButton.addEventListener("click", function () {
            var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            localStorage.setItem("site-theme", next);
            syncTheme();
          });
        }

        function syncHeader() {
          if (masthead) masthead.classList.toggle("is-scrolled", window.scrollY > 4);
        }
        window.addEventListener("scroll", syncHeader, { passive: true });
        syncHeader();
        syncTheme();

        var revealItems = document.querySelectorAll(".home-section, .publication-timeline article, .archive__item");
        revealItems.forEach(function (item) { item.setAttribute("data-reveal", ""); });
        if (!reduceMotion && "IntersectionObserver" in window) {
          root.classList.add("reveal-ready");
          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: 0.08, rootMargin: "0px 0px -40px" });
          revealItems.forEach(function (item) { observer.observe(item); });
        }
      });
    </script>

  </body>
</html>
